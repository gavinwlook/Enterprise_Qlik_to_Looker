[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-qlik-to-looker"
version = "2.0.0"
description = "Enterprise-grade, decoupled Qlik-to-Looker migration engine with 3-tier compatibility analysis, open Canonical IR, and Explore-first LookML modeling."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Gavin Look"}
]
keywords = ["qlik", "looker", "lookml", "migration", "bi", "canonical-ir", "bigquery"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Telecommunications Industry",
    "Topic :: Database",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
enterprise-qlik = "enterprise_qlik.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["enterprise_qlik*"]
